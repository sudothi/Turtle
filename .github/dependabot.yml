version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gradle
    directory: /apps/android
    schedule: { interval: weekly }
    # Atualizações major do Android quebram o build e precisam ser feitas juntas (issue #130).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Kotlin, coroutines e androidx andam juntos: subir um sem os outros quebra o build
      # (jvmTarget removido, metadados novos, compileSdk). Sobem todos de uma vez, à mão, na #130.
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "org.jetbrains.kotlinx*"
      - dependency-name: "androidx.*"
      - dependency-name: "com.google.devtools.ksp*"
