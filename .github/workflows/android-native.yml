name: Android nativo (APK)
# Gera o APK do app nativo (Kotlin + Compose). Roda em PRs que mexem em apps/android e sob demanda.
# O APK fica em "Artifacts" na página da execução. Guia: apps/android/README.md.
on:
  workflow_dispatch:
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android-native.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Chave de assinatura (opcional)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/turtle.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/turtle.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: assinando com a chave de debug."
          fi
      - name: Testes
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            echo "=== PRIMEIROS ERROS ==="
            grep -m 12 -E "^(e: |w: .*error|.*FAILED)" "$RUNNER_TEMP/test.log" | cut -c1-260
            exit 1
          }
      - name: Compila o APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            echo "=== PRIMEIROS ERROS ==="
            grep -m 12 -E "^e: " "$RUNNER_TEMP/build.log" | cut -c1-260
            exit 1
          }
      - run: mv app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/turtle-nativo.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: turtle-android-nativo
          path: ${{ runner.temp }}/turtle-nativo.apk
          retention-days: 30
