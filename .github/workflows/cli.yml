name: CLI (Turtle Setup)
# Gera o executável único do Turtle Setup para Windows, macOS e Linux. Roda em PRs que mexem no CLI
# (artefatos na execução) e, numa tag cli-v*, publica uma Release no GitHub com os três binários e os
# SHA-256. É esse link que o site público mostra como "Download DEV".
on:
  pull_request:
    paths: ["apps/cli/**", ".github/workflows/cli.yml"]
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binario:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: turtle-setup-windows-x64.exe
          - os: macos-latest
            nome: turtle-setup-macos-arm64
          - os: ubuntu-latest
            nome: turtle-setup-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @turtle/cli test
      - run: pnpm --filter @turtle/cli typecheck
      - run: pnpm --filter @turtle/cli sea
      - name: Fumaça
        shell: bash
        run: |
          ./apps/cli/release/${{ matrix.nome }} --version
          ./apps/cli/release/${{ matrix.nome }} instalar --ip 203.0.113.10 --domain exemplo.com --user ubuntu --dry-run --yes | head -5
      - name: SHA-256
        shell: bash
        run: |
          cd apps/cli/release
          (sha256sum "${{ matrix.nome }}" 2>/dev/null || shasum -a 256 "${{ matrix.nome }}") > "${{ matrix.nome }}.sha256"
          cat "${{ matrix.nome }}.sha256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.nome }}
          path: |
            apps/cli/release/${{ matrix.nome }}
            apps/cli/release/${{ matrix.nome }}.sha256
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: binario
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with: { path: binarios, merge-multiple: true }
      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l binarios
          gh release create "${{ github.ref_name }}" binarios/* \
            --repo "${{ github.repository }}" \
            --title "Turtle Setup ${{ github.ref_name }}" \
            --notes "Assistente para instalar e cuidar do seu Turtle numa VPS. Baixe o arquivo do seu sistema, confira o SHA-256 e rode \`turtle-setup instalar\`. Guia: apps/cli/README.md. O Windows pode mostrar o SmartScreen (o executável não é assinado): Mais informações > Executar assim mesmo."
