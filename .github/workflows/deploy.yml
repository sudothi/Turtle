name: Deploy (VPS)
# Sobe uma versão do servidor (API + site) na VPS. Só o serviço api reinicia; o LiveKit não,
# então as chamadas não caem (o chat reconecta em alguns segundos).
#
# Só manual: Actions > Deploy (VPS) > Run workflow. Deixe "sha" vazio para subir a main atual,
# ou informe um sha antigo para voltar a ele (rollback). O CI daquele commit precisa estar verde.
# Não há deploy automático a cada merge: o GitHub Free não deixa exigir aprovação em Environments
# de repositório privado. Se o repositório passar para um plano com "Required reviewers", dá para
# voltar o gatilho workflow_run (ver o histórico deste arquivo).
#
# Os secrets ficam no Environment "production" (não no repositório):
#   DEPLOY_SSH_KEY (chave privada dedicada, com comando forçado na VPS),
#   DEPLOY_HOST (IP da VPS) e DEPLOY_KNOWN_HOSTS (saída de ssh-keyscan da VPS).
# O que roda na VPS está em infra/deploy.sh.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit para subir (vazio = main atual)"
        required: false
        default: ""

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escolher o commit
        id: alvo
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          ref="${INPUT_SHA:-origin/main}"
          sha="$(git rev-parse --verify "${ref}^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Commit: $sha" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='%s' "$sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Conferir se o CI do commit passou
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.alvo.outputs.sha }}
        run: |
          conclusao="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.total_count')"
          if [ "$conclusao" = "0" ]; then
            echo "::error::O CI desse commit não está verde (ou não rodou). Deploy cancelado."
            exit 1
          fi

      - name: Enviar para a VPS e subir
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ steps.alvo.outputs.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar.gz "$SHA" \
            | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
                -o ServerAliveInterval=30 "kyo@$HOST" "deploy $SHA"
          echo "Deploy de ${SHA:0:7} concluído." >> "$GITHUB_STEP_SUMMARY"

      - name: Conferir de fora
        run: curl -fsS --retry 5 --retry-delay 3 https://turtlechat.tech/health
