<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; font-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Turtle</title>
<style>
  @font-face { font-family: "Bricolage"; src: url(fonts/bricolage.woff2) format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Figtree"; src: url(fonts/figtree.woff2) format("woff2"); font-weight: 300 900; }
  :root { --ink: #000; --ink-2: #111; --paper: #f5f3ee; --dim: #c9c6bf; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-app-region: drag; cursor: default; }
  body { padding: 10px; font-family: "Figtree", system-ui, sans-serif; color: var(--paper); }
  /* Chapa de linóleo: borda de goiva que "ferve" (mesmo efeito da tela de login). */
  .card { position: relative; height: 100%; border-radius: 12px; display: grid; place-items: center; text-align: center; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0; border: 2px solid var(--paper); border-radius: 12px; background: var(--ink-2); filter: url(#lino); }
  .content { position: relative; display: flex; flex-direction: column; align-items: center; }
  .mark { width: 128px; height: 128px; filter: url(#lino-lg); animation: nado 2.6s ease-in-out infinite; }
  h1 { margin: 14px 0 0; font: 800 34px/1 "Bricolage", system-ui, sans-serif; letter-spacing: -0.5px; }
  #status { margin: 10px 0 0; min-height: 18px; font-size: 13px; color: var(--dim); }
  .barra { width: 180px; height: 8px; margin-top: 12px; border: 2px solid var(--paper); border-radius: 3px; filter: url(#lino); visibility: hidden; }
  .barra.on { visibility: visible; }
  .barra i { display: block; height: 100%; width: 0%; background: var(--paper); transition: width 200ms; }
  .estrelas { position: absolute; inset: 0; pointer-events: none; }
  .estrelas use { fill: var(--paper); animation: pisca 1.25s steps(2) infinite; }
  .estrelas use:nth-child(3n) { animation-delay: -0.6s; }
  .ondas { position: absolute; left: 4px; right: 4px; bottom: 4px; height: 64px; border-radius: 0 0 10px 10px; pointer-events: none; }
  .ondas path { fill: none; stroke: var(--paper); stroke-width: 2.4; stroke-linecap: round; filter: url(#lino); }
  @keyframes nado { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }
  @keyframes pisca { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .mark, .estrelas use { animation: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="lino" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="4" result="n">
        <animate attributeName="seed" values="4;11;23;7;16" dur="1.25s" calcMode="discrete" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="lino-lg" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="9" result="n">
        <animate attributeName="seed" values="9;2;30;14" dur="1.1s" calcMode="discrete" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <path id="estrela" d="M0-10C1-3 3-1 10 0 3 1 1 3 0 10-1 3-3 1-10 0-3-1-1-3 0-10Z" />
  </defs>
</svg>
<div class="card">
  <svg class="estrelas" viewBox="0 0 320 380" preserveAspectRatio="none" aria-hidden="true">
    <use href="#estrela" transform="translate(42 44) scale(.7)" />
    <use href="#estrela" transform="translate(78 92) scale(.4)" />
    <use href="#estrela" transform="translate(268 38) scale(.55)" />
    <use href="#estrela" transform="translate(232 78) scale(.35)" />
    <use href="#estrela" transform="translate(286 128) scale(.45)" />
    <use href="#estrela" transform="translate(30 150) scale(.35)" />
    <use href="#estrela" transform="translate(150 26) scale(.3)" />
  </svg>
  <svg class="ondas" viewBox="0 0 320 60" preserveAspectRatio="none" aria-hidden="true">
    <path d="M-5 12c18-6 34 2 52-2s26-7 44-1 30 3 46-2M150 8c22 5 40-4 62 0s30 6 48 1 34-4 66 2" />
    <path d="M-5 28c22 5 40-5 60-1s28 6 50 1 24-6 40-2M150 30c20-6 38 3 58-1s34-5 52 0 30 4 66-1" />
    <path d="M-5 45c26-5 44 4 66 0s30-6 52-1 30 5 46 0M165 46c20 6 36-4 56 0s28 5 48 0 30-3 56 1" />
    <path d="M-5 59c30 3 60-3 90 0s60 3 90-1 60-3 150 1" />
  </svg>
  <div class="content">
    <img class="mark" src="turtle-mark-paper.svg" alt="">
    <h1>Turtle</h1>
    <p id="status">Abrindo…</p>
    <div class="barra" id="barra"><i id="progresso"></i></div>
  </div>
</div>
<script>
  // O processo principal chama turtleSplash(texto, porcentagem?) para mostrar o andamento.
  window.turtleSplash = (texto, pct) => {
    document.getElementById("status").textContent = texto;
    const barra = document.getElementById("barra");
    barra.classList.toggle("on", typeof pct === "number");
    if (typeof pct === "number") document.getElementById("progresso").style.width = Math.max(0, Math.min(100, pct)) + "%";
  };
</script>
</body>
</html>
