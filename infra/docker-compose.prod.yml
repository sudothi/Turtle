# Produção (VPS): Caddy (HTTPS), LiveKit, Postgres e o servidor do Turtle (api: API + site).
# Na VPS este arquivo fica em ~/turtle/docker-compose.yml (copiado de infra/docker-compose.prod.yml).
# Logs do Docker com limite (o padrão cresce sem fim e enche o disco): até 5 arquivos de 10 MB por serviço.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  caddy:
    image: caddy:2
    logging: *logging
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DOMAIN_APP: ${DOMAIN_APP:-app.ogturtle.xyz}
      DOMAIN_LK: ${DOMAIN_LK:-lk.ogturtle.xyz}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./desktop:/srv/desktop:ro
      - caddy_data:/data
      - caddy_config:/config

  livekit:
    image: livekit/livekit-server:v1.13.11
    logging: *logging
    restart: unless-stopped
    network_mode: host # recomendado para WebRTC
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?defina LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?defina LIVEKIT_API_SECRET}"
      LIVEKIT_WEBHOOK_API_KEY: "${LIVEKIT_API_KEY:?defina LIVEKIT_API_KEY}"
      LIVEKIT_TURN_CERT: "/caddy_data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${DOMAIN_LK:-lk.ogturtle.xyz}/${DOMAIN_LK:-lk.ogturtle.xyz}.crt"
      LIVEKIT_TURN_KEY: "/caddy_data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${DOMAIN_LK:-lk.ogturtle.xyz}/${DOMAIN_LK:-lk.ogturtle.xyz}.key"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      - caddy_data:/caddy_data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7880 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17
    logging: *logging
    restart: unless-stopped
    # sem "ports:" de propósito: portas publicadas pelo Docker ignoram o UFW
    environment:
      POSTGRES_USER: kyo
      POSTGRES_DB: turtle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyo -d turtle"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: turtle-app:latest
    logging: *logging
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DATABASE_URL: postgres://kyo:${POSTGRES_PASSWORD}@postgres:5432/turtle
      LIVEKIT_URL: wss://${DOMAIN_LK:-lk.ogturtle.xyz}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?defina LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?defina LIVEKIT_API_SECRET}
      BOOTSTRAP_INVITE: ${BOOTSTRAP_INVITE:?defina BOOTSTRAP_INVITE}
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes: ["uploads:/data/uploads"]

volumes: { caddy_data: {}, caddy_config: {}, pg_data: {}, uploads: {} }
