# Produção (VPS): espelho do ~/turtle/docker-compose.yml do servidor (Postgres, LiveKit, API+site e Caddy com HTTPS).
# No VPS os arquivos ficam todos em ~/turtle (compose, .env, Caddyfile, livekit.yaml, backup.sh) e a imagem é
# construída antes com `docker build -t turtle-app:<commit> .`; aqui o `build` faz o mesmo a partir do repositório.
# Uso a partir de infra/: cp .env.prod.example .env (preencher) && docker compose -f docker-compose.prod.yml up -d --build
# O LiveKit usa a rede do host (recomendado para WebRTC); o Postgres não publica porta (o Docker ignora o UFW).
name: turtle
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DOMAIN_APP: ${DOMAIN_APP}
      DOMAIN_LK: ${DOMAIN_LK}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes: ["./livekit.prod.yaml:/etc/livekit.yaml:ro"]

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: kyo
      POSTGRES_DB: turtle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyo -d turtle"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: turtle-app:${APP_TAG:-local}
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DATABASE_URL: postgres://kyo:${POSTGRES_PASSWORD}@postgres:5432/turtle
      LIVEKIT_URL: wss://${DOMAIN_LK}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      BOOTSTRAP_INVITE: ${BOOTSTRAP_INVITE}
      # Fotos de perfil e banners (volume abaixo; entra no backup junto com o Postgres).
      UPLOAD_DIR: /data/uploads
    volumes: ["uploads:/data/uploads"]

volumes: { caddy_data: {}, caddy_config: {}, pg_data: {}, uploads: {} }
