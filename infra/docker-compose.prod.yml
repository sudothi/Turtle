# Produção (VPS): Postgres, LiveKit, o app (API + site) e o Caddy com HTTPS automático.
# Uso: copie .env.prod.example para .env, preencha e rode `docker compose -f docker-compose.prod.yml up -d --build`
# (a partir da raiz do repositório). O Caddy publica 80/443; o Postgres não é exposto.
name: turtle
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: turtle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: turtle
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turtle"]
      interval: 10s
      retries: 5

  app:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://turtle:${POSTGRES_PASSWORD}@postgres:5432/turtle
      LIVEKIT_URL: wss://lk.${DOMAIN:-ogturtle.xyz}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?defina LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?defina LIVEKIT_API_SECRET}
      # Código do primeiro cadastro (o primeiro usuário vira admin e dono do servidor "Turtle").
      BOOTSTRAP_INVITE: ${BOOTSTRAP_INVITE:?defina BOOTSTRAP_INVITE}
      # Fotos de perfil e banners (volume abaixo; entra no backup junto com o Postgres).
      UPLOAD_DIR: /data/uploads
    volumes: ["uploads:/data/uploads"]

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:?defina LIVEKIT_KEYS}
    ports:
      - "7881:7881"
      - "7882:7882/udp"
      - "3478:3478/udp"
    volumes: ["./livekit.prod.yaml:/etc/livekit.yaml:ro"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-ogturtle.xyz}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./desktop:/srv/desktop:ro
      - caddy_data:/data
    depends_on: [app, livekit]

volumes:
  pgdata:
  uploads:
  caddy_data:
