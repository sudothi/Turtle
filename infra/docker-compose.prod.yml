# Produção (VPS), espelho de ~/turtle/docker-compose.yml. No VPS o código fica em ~/turtle/src, a imagem
# é construída à mão (docker build -t turtle-app:<commit> src) e o tag abaixo é atualizado a cada deploy.
# Backup: backup.sh (cron do usuário kyo, 07:00 UTC) guarda o dump do Postgres e o volume uploads.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DOMAIN_APP: ${DOMAIN_APP}
      DOMAIN_LK: ${DOMAIN_LK}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    network_mode: host          # recomendado para WebRTC
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]

  postgres:
    image: postgres:17
    restart: unless-stopped
    # sem "ports:" de propósito: portas publicadas pelo Docker ignoram o UFW
    environment:
      POSTGRES_USER: kyo
      POSTGRES_DB: turtle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyo -d turtle"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: turtle-app:c13c10d
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DATABASE_URL: postgres://kyo:${POSTGRES_PASSWORD}@postgres:5432/turtle
      LIVEKIT_URL: wss://${DOMAIN_LK}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      BOOTSTRAP_INVITE: ${BOOTSTRAP_INVITE}
      UPLOAD_DIR: /data/uploads
    volumes: ["uploads:/data/uploads"]

volumes: { caddy_data: {}, caddy_config: {}, pg_data: {}, uploads: {} }
