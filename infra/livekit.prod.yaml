# LiveKit de produção. As chaves vêm do .env (LIVEKIT_KEYS="chave: segredo") e nunca ficam no repositório.
port: 7880
log_level: info
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
turn:
  enabled: true
  udp_port: 3478
  tls_port: 5349
  domain: lk.turtlechat.tech
  cert_file: /caddy_data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/lk.turtlechat.tech/lk.turtlechat.tech.crt
  key_file: /caddy_data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/lk.turtlechat.tech/lk.turtlechat.tech.key
# Webhooks (#91): o app confere quem está de fato nas salas (a api_key vem de LIVEKIT_WEBHOOK_API_KEY no compose).
webhook:
  urls:
    - https://turtlechat.tech/livekit/webhook
