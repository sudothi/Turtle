# LiveKit de produção. As chaves vêm do .env (LIVEKIT_KEYS="chave: segredo") e nunca ficam no repositório.
port: 7880
log_level: info
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
turn:
  enabled: true
  udp_port: 3478
  domain: lk.ogturtle.xyz
# Webhooks: o app confere quem está de fato nas salas (tira quem entrou sem permissão ou sem avisar o gateway,
# e tira da lista quem caiu do LiveKit). Para ligar, troque CHAVE pela chave (a parte antes do ":") do
# LIVEKIT_KEYS e use o nome do serviço do app no compose (no VPS hoje é "api"). Mexe em produção.
# webhook:
#   api_key: CHAVE
#   urls:
#     - http://app:3000/livekit/webhook
