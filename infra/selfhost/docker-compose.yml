# Turtle em uma VPS sua: Caddy (HTTPS), LiveKit (voz/vídeo), Postgres e o app.
# Use com o install.sh, que cria o .env e o livekit.yaml desta pasta.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  caddy:
    image: caddy:2
    logging: *logging
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DOMAIN_APP: ${DOMAIN_APP:?rode ./install.sh}
      DOMAIN_LK: ${DOMAIN_LK:?rode ./install.sh}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./desktop:/srv/desktop:ro
      - caddy_data:/data
      - caddy_config:/config

  livekit:
    image: livekit/livekit-server:v1.13.11
    logging: *logging
    restart: unless-stopped
    network_mode: host # recomendado para WebRTC
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}"
      LIVEKIT_WEBHOOK_API_KEY: "${LIVEKIT_API_KEY:?}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  postgres:
    image: postgres:17
    logging: *logging
    restart: unless-stopped
    # sem "ports:" de propósito: portas publicadas pelo Docker ignoram o firewall (UFW)
    environment:
      POSTGRES_USER: turtle
      POSTGRES_DB: turtle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turtle -d turtle"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: { context: ../.., dockerfile: Dockerfile }
    image: turtle-app:selfhost
    logging: *logging
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://turtle:${POSTGRES_PASSWORD}@postgres:5432/turtle
      LIVEKIT_URL: wss://${DOMAIN_LK}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      BOOTSTRAP_INVITE: ${BOOTSTRAP_INVITE:?}
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WAITLIST_NOTIFY_TO: ${WAITLIST_NOTIFY_TO:-}
    volumes: ["uploads:/data/uploads"]

volumes: { caddy_data: {}, caddy_config: {}, pg_data: {}, uploads: {} }
